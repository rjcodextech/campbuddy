# Codemagic builds the iOS app (needs macOS and Apple signing).
# One-time setup, see mobile-app/SETUP.md section 4:
#   1. Codemagic > Teams > Integrations > App Store Connect: add an API key
#      and name it "campbuddy_asc".
#   2. Codemagic > Environment variables, group "campbuddy_ios":
#        GOOGLE_SERVICE_INFO_PLIST   base64 of GoogleService-Info.plist
#   3. Create the app in App Store Connect with bundle id club.campbuddy.app.

workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: campbuddy_asc
    environment:
      groups:
        - campbuddy_ios
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: club.campbuddy.app
      vars:
        XCODE_PROJECT: mobile-app/app/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events: []
    scripts:
      - name: Install and sync
        script: |
          cd mobile-app/app
          npm ci
          npm test
          npx cap sync ios
      - name: Firebase config
        script: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST" && echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > mobile-app/app/ios/App/App/GoogleService-Info.plist || true
      - name: Build number from Codemagic
        script: |
          cd mobile-app/app/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build the archive
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
