<!doctype html>
<!--
  CampBuddy promotion ID card: front (name) and back (QR code), print size.
  Card: 86 × 54 mm, landscape, + 3 mm bleed on every side = 92 × 60 mm.
  render.mjs fills in the names and the QR code and prints PDFs + 300 dpi PNGs.
  Open ?guides in a browser to see the trim line (blue) and the safe area (pink).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CampBuddy ID card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --wine: #721313;
    --ochre: #d77b06;
    --cream: #fbecd8;
    --paper: #fffaf4;
    --ink: #231f20;
    --muted: #6b5f5a;
    --bleed: 3mm;
    --w: 92mm;   /* 86 + bleed */
    --h: 60mm;   /* 54 + bleed */
    --mark: 6mm; /* room for crop marks (marks mode) */
  }
  {{PAGE}}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #9a9a9a; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { display: flex; flex-wrap: wrap; gap: 10mm; padding: 10mm; }
  @media print { html, body { background: none; } .sheet { display: block; padding: 0; } }

  /* One printed page: the card, or (marks mode) the card with crop marks around it. */
  .page { position: relative; break-after: page; }
  .marks .page { width: calc(var(--w) + 2 * var(--mark)); height: calc(var(--h) + 2 * var(--mark)); background: #fff; }
  .marks .card { position: absolute; left: var(--mark); top: var(--mark); }
  .crop { display: none; position: absolute; background: #000; }
  .marks .crop { display: block; }
  /* Lines in line with the trim, outside the bleed. */
  .crop.h { height: .25pt; width: calc(var(--mark) - 1mm); }
  .crop.v { width: .25pt; height: calc(var(--mark) - 1mm); }
  .crop.h.l { left: 0; } .crop.h.r { right: 0; }
  .crop.v.t { top: 0; } .crop.v.b { bottom: 0; }
  .crop.h.t { top: calc(var(--mark) + var(--bleed)); } .crop.h.b { bottom: calc(var(--mark) + var(--bleed)); }
  .crop.v.l { left: calc(var(--mark) + var(--bleed)); } .crop.v.r { right: calc(var(--mark) + var(--bleed)); }

  .card { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }

  .pattern {
    position: absolute; inset: 0;
    background-image: url('../../public/media/pattern-icons.svg');
    background-size: 24mm 24mm;
    opacity: .28;
  }

  /* ---------------- Front ---------------- */
  .front .side {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: calc(var(--bleed) + 29mm);
    overflow: hidden;
    background: var(--wine);
  }
  /* A ticket's tear line between the stub and the card: dashes, and a
     half-round bite where it meets the top and bottom edges. */
  .front .perf {
    position: absolute; top: 0; bottom: 0;
    left: calc(var(--bleed) + 29mm - .25mm);
    width: .5mm;
    background: repeating-linear-gradient(to bottom, var(--cream) 0 1.4mm, transparent 1.4mm 2.6mm);
    opacity: .75;
  }
  .front .bite {
    position: absolute;
    left: calc(var(--bleed) + 29mm - 2.6mm);
    width: 5.2mm; height: 5.2mm;
    border-radius: 50%;
    background: var(--paper);
  }
  .front .bite.t { top: calc(var(--bleed) - 2.6mm); }
  .front .bite.b { bottom: calc(var(--bleed) - 2.6mm); }
  /* Rings behind the app icon, like a signal going out. */
  .front .rings {
    position: absolute;
    left: calc(var(--bleed) + 14.5mm); top: 50%;
    width: 0; height: 0;
  }
  .front .rings i {
    position: absolute; border-radius: 50%;
    border: .3mm solid rgba(251, 236, 216, .16);
    transform: translate(-50%, -50%);
  }
  .front .rings i:nth-child(1) { width: 30mm; height: 30mm; }
  .front .rings i:nth-child(2) { width: 40mm; height: 40mm; border-color: rgba(251, 236, 216, .1); }
  .front .rings i:nth-child(3) { width: 50mm; height: 50mm; border-color: rgba(251, 236, 216, .06); }
  .front .mark {
    position: absolute;
    left: calc(var(--bleed) + 4.5mm);
    top: calc(50% - 10mm);
    width: 20mm; height: 20mm;
    border-radius: 4.6mm;
    background: var(--paper);
    padding: 1.1mm;
    box-shadow: 0 0 0 .8mm var(--ochre), 0 1.2mm 3.5mm rgba(0, 0, 0, .3);
  }
  .front .mark img { width: 100%; height: 100%; display: block; }
  /* The app mark again, large and faint, tucked into the far corner. */
  .front .watermark {
    position: absolute;
    right: -9mm; bottom: -11mm;
    width: 40mm;
    opacity: .06;
    transform: rotate(-12deg);
  }

  .front .main {
    position: absolute;
    left: calc(var(--bleed) + 29mm + 5mm);
    right: calc(var(--bleed) + 4.5mm);
    top: calc(var(--bleed) + 6mm);
    bottom: calc(var(--bleed) + 4.5mm);
    display: flex; flex-direction: column;
  }
  .front .logo { width: 30mm; display: block; }
  .front .who { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .front .hello { margin-bottom: 1.3mm; color: var(--ochre); font-size: 5.4pt; font-weight: 800; letter-spacing: .26em; text-transform: uppercase; }
  .front .name {
    color: var(--wine);
    font-weight: 800;
    font-size: 17pt;
    line-height: 1.06;
    letter-spacing: -.015em;
    text-wrap: balance;
  }
  .front .rule { width: 9mm; height: .8mm; border-radius: 1mm; background: var(--ochre); margin-top: 2.2mm; }
  .front .role { margin-top: 1.6mm; color: var(--muted); font-size: 6.6pt; font-weight: 600; }
  .front .role:empty { display: none; }
  .front .ask {
    display: flex; align-items: center; justify-content: space-between; gap: 2mm;
    padding-top: 2mm;
    border-top: .25mm solid rgba(114, 19, 19, .18);
    font-size: 5.7pt; font-weight: 600; color: var(--ink);
    white-space: nowrap;
  }
  .front .ask strong { color: var(--wine); font-weight: 800; }
  .front .ask .site { color: var(--ochre); font-weight: 800; letter-spacing: .01em; }

  /* ---------------- Back ---------------- */
  .back { background: var(--wine); color: var(--cream); }
  .back .glow { position: absolute; inset: 0; background: radial-gradient(55% 70% at 78% 50%, rgba(215, 123, 6, .25), transparent 70%); }
  .back .text {
    position: absolute;
    left: calc(var(--bleed) + 6mm);
    top: calc(var(--bleed) + 6mm);
    bottom: calc(var(--bleed) + 5.5mm);
    width: 41mm;
    display: flex; flex-direction: column; justify-content: center;
  }
  .back .kicker { font-size: 5.2pt; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--ochre); }
  .back h1 { white-space: nowrap; margin-top: 1.6mm; font-size: 9.8pt; line-height: 1.12; font-weight: 900; color: #fff; letter-spacing: -.015em; }
  .back .feats { margin-top: 4.2mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.6mm 1.5mm; }
  .back .feat { display: flex; flex-direction: column; align-items: center; gap: 1mm; text-align: center; white-space: nowrap; font-size: 5.3pt; font-weight: 700; line-height: 1.1; color: var(--cream); }
  .back .ico {
    display: flex; align-items: center; justify-content: center;
    width: 6.8mm; height: 6.8mm;
    border-radius: 50%;
    background: rgba(251, 236, 216, .1);
    border: .3mm solid rgba(215, 123, 6, .8);
    color: var(--ochre);
  }
  .back .ico svg { width: 3.6mm; height: 3.6mm; }
  .back .url { margin-top: auto; padding-top: 2mm; font-size: 8.4pt; font-weight: 800; color: #fff; }
  .back .qrbox {
    position: absolute;
    right: calc(var(--bleed) + 6mm);
    top: 50%; transform: translateY(-50%);
    width: 30mm;
    text-align: center;
  }
  .back .qr {
    width: 30mm; height: 30mm;
    padding: 2.2mm;
    border-radius: 2.6mm;
    background: #fff;
    box-shadow: 0 0 0 .7mm var(--ochre);
  }
  .back .qr svg { width: 100%; height: 100%; display: block; }
  .back .scan { margin-top: 2.6mm; font-size: 6.4pt; font-weight: 800; color: #fff; }
  .back .scan span { display: block; margin-top: .6mm; font-size: 7.6pt; font-weight: 800; color: var(--ochre); letter-spacing: .01em; }

  /* Guides (browser only, ?guides). */
  .guides .card::before, .guides .card::after { content: ''; position: absolute; z-index: 9; pointer-events: none; }
  .guides .card::before { inset: var(--bleed); outline: .2mm solid #00b3ff; border-radius: 3.2mm; }
  .guides .card::after { inset: calc(var(--bleed) + 3mm); outline: .2mm dashed #ff00a8; }
</style>
</head>
<body class="{{MODE}}">
<div class="sheet">
{{PAGES}}
</div>
<script>
  // A long name steps down in size until it fits the space (two lines at most).
  (async () => {
    await document.fonts.ready;
    for (const name of document.querySelectorAll('.name')) {
      const box = name.parentElement;
      const lines = () => Math.round(name.getBoundingClientRect().height / parseFloat(getComputedStyle(name).lineHeight));
      let size = 17;
      while ((lines() > 2 || box.scrollHeight > box.clientHeight || name.scrollWidth > name.clientWidth) && size > 10) {
        size -= 0.5;
        name.style.fontSize = size + 'pt';
      }
    }
    if (location.search.includes('guides')) document.body.classList.add('guides');
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
