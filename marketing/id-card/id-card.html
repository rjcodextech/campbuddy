<!doctype html>
<!--
  CampBuddy promotion ID card — front and back, print size.
  Card: 54 × 85.6 mm (CR80, portrait) + 3 mm bleed on every side = 60 × 91.6 mm.
  render.mjs fills in the name, role and QR code and prints PNG (300 dpi) + PDF.
  Open ?guides in a browser to see the trim line and the safe area.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CampBuddy ID card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --wine: #721313;
    --wine-deep: #5a0f0f;
    --ochre: #d77b06;
    --maroon: #c33a19;
    --cream: #fbecd8;
    --paper: #fffaf4;
    --ink: #231f20;
    --bleed: 3mm;
  }
  @page { size: 60mm 91.6mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { display: flex; gap: 10mm; padding: 10mm; }
  @media print { html, body { background: none; } .sheet { display: block; padding: 0; } }

  .card {
    position: relative;
    width: 60mm;
    height: 91.6mm;
    overflow: hidden;
    break-after: page;
    background: var(--paper);
  }
  /* The finished card inside the bleed. */
  .trim { position: absolute; inset: var(--bleed); }

  /* ---------------- Front ---------------- */
  .front .band {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: calc(var(--bleed) + 30mm);
    background: var(--wine);
    border-bottom-left-radius: 50% 7mm;
    border-bottom-right-radius: 50% 7mm;
  }
  .pattern {
    position: absolute; inset: 0;
    background-image: url('../../public/media/pattern-icons.svg');
    background-size: 26mm 26mm;
    opacity: .35;
  }
  .front .band .pattern { border-radius: inherit; }
  .front .tag {
    position: absolute;
    top: 10.5mm; left: 0; right: 0;
    text-align: center;
    color: var(--cream);
    font-size: 5.6pt;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
  }
  .front .tag b { color: var(--ochre); font-weight: 800; }
  .front .mark {
    position: absolute;
    top: 16mm; left: 50%;
    width: 25mm; height: 25mm;
    transform: translateX(-50%);
    border-radius: 6mm;
    background: var(--paper);
    box-shadow: 0 0 0 1.2mm var(--paper), 0 1.5mm 4mm rgba(60, 10, 10, .28);
  }
  .front .mark img { width: 100%; height: 100%; display: block; }
  .front .who {
    position: absolute;
    top: 45mm; left: 4mm; right: 4mm;
    height: 17mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .front .name {
    color: var(--wine);
    font-weight: 800;
    font-size: 15pt;
    line-height: 1.08;
    letter-spacing: -.01em;
  }
  .front .role {
    margin-top: 1.4mm;
    color: var(--ochre);
    font-weight: 700;
    font-size: 7.4pt;
  }
  .front .name:empty, .front .role:empty { display: none; }
  .front .ask {
    position: absolute;
    top: 64.5mm; left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 1.5mm 3.6mm;
    border-radius: 10mm;
    background: var(--cream);
    border: .35mm solid rgba(114, 19, 19, .25);
    color: var(--wine);
    font-size: 6.6pt;
    font-weight: 700;
  }
  .front .ask span { color: var(--ochre); }
  .front .foot {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: calc(var(--bleed) + 11.5mm);
    background: var(--cream);
    border-top: .35mm solid rgba(114, 19, 19, .15);
  }
  .front .logo {
    position: absolute;
    bottom: calc(var(--bleed) + 3.4mm);
    left: 50%;
    width: 33mm;
    transform: translateX(-50%);
  }

  /* ---------------- Back ---------------- */
  .back { background: var(--wine); color: var(--cream); }
  .back .pattern { opacity: .3; }
  .back .glow {
    position: absolute; inset: 0;
    background: radial-gradient(60% 45% at 50% 44%, rgba(215, 123, 6, .22), transparent 70%);
  }
  .back .head {
    position: absolute;
    top: 11mm; left: 4mm; right: 4mm;
    text-align: center;
  }
  .back .kicker { font-size: 5.6pt; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--ochre); }
  .back h1 { margin-top: 1.6mm; font-size: 12pt; line-height: 1.12; font-weight: 900; color: #fff; letter-spacing: -.01em; }
  .back .qr {
    position: absolute;
    top: 30mm; left: 50%;
    width: 31mm; height: 31mm;
    transform: translateX(-50%);
    padding: 2.4mm;
    border-radius: 3mm;
    background: #fff;
    box-shadow: 0 0 0 .9mm var(--ochre);
  }
  .back .qr svg { width: 100%; height: 100%; display: block; }
  .back .scan {
    position: absolute;
    top: 63.5mm; left: 0; right: 0;
    text-align: center;
  }
  .back .scan b { display: block; font-size: 7.6pt; font-weight: 800; color: #fff; }
  .back .scan span { display: block; margin-top: .6mm; font-size: 9pt; font-weight: 800; color: var(--ochre); letter-spacing: .01em; }
  .back .features {
    position: absolute;
    left: 3.5mm; right: 3.5mm;
    bottom: 5.2mm;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1mm;
  }
  .back .features span {
    padding: .8mm 2mm;
    border-radius: 10mm;
    border: .3mm solid rgba(251, 236, 216, .45);
    font-size: 5.2pt;
    font-weight: 600;
    color: var(--cream);
    white-space: nowrap;
  }

  /* Guides (browser only, ?guides): trim (solid) and 3 mm safe area (dashed). */
  .guides .card::before, .guides .card::after { content: ''; position: absolute; z-index: 9; pointer-events: none; }
  .guides .card::before { inset: var(--bleed); outline: .2mm solid #00b3ff; border-radius: 3.2mm; }
  .guides .card::after { inset: calc(var(--bleed) + 3mm); outline: .2mm dashed #ff00a8; }
</style>
</head>
<body>
<div class="sheet">
  <section class="card front{{BLANK}}" aria-label="Front">
    <div class="band"><div class="pattern"></div></div>
    <p class="tag">Team <b>CampBuddy</b></p>
    <div class="mark"><img src="../../public/media/favicon.png" alt=""></div>
    <div class="who">
      <p class="name" id="name">{{NAME}}</p>
      <p class="role">{{ROLE}}</p>
    </div>
    <p class="ask">Ask me about <span>CampBuddy</span> 👋</p>
    <div class="foot"></div>
    <img class="logo" src="../../public/media/logo.png" alt="CampBuddy">
  </section>

  <section class="card back" aria-label="Back">
    <div class="pattern"></div>
    <div class="glow"></div>
    <div class="head">
      <p class="kicker">Free for every attendee</p>
      <h1>Your whole WordCamp<br>in one app</h1>
    </div>
    <div class="qr">{{QR}}</div>
    <p class="scan"><b>Scan to open CampBuddy</b><span>campbuddy.club</span></p>
    <div class="features">
      <span>My schedule</span><span>Meet people</span><span>Camp Card</span><span>Quests</span><span>Deals</span><span>Works offline</span>
    </div>
  </section>
</div>
<script>
  // A long name steps down in size until it fits the name box (two lines at most).
  (async () => {
    await document.fonts.ready;
    const name = document.getElementById('name');
    const box = name.parentElement;
    let size = 15;
    while ((box.scrollHeight > box.clientHeight || name.getClientRects().length > 2 || name.scrollWidth > box.clientWidth) && size > 9) {
      size -= 0.5;
      name.style.fontSize = size + 'pt';
    }
    if (location.search.includes('guides')) document.body.classList.add('guides');
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
