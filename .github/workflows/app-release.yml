name: App release (Android)

# Builds a signed Android App Bundle for the Play Console. Run by hand:
# Actions > App release (Android) > Run workflow. iOS is released from
# Codemagic (codemagic.yaml at the repo root) because it needs Apple signing.
#
# Secrets (Settings > Secrets and variables > Actions) - see mobile-app/SETUP.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON (base64 of google-services.json)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (a whole number higher than the last upload)'
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile-app/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - name: Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" && echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: npx cap sync android
      - name: Set the version code
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/" android/app/build.gradle
      - name: Bundle
        working-directory: mobile-app/app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: campbuddy-release-aab
          path: mobile-app/app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
